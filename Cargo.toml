[package]
name = "agent-capy"
version = "0.1.0"
edition = "2024"
default-run = "capy"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[[bin]]
name = "capy"
path = "src/main.rs"
